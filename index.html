<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOOMA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff5fa;
  color: #241d24;
  transition: background 0.3s, color 0.3s;
}

header {
  height: 70px;
  padding: 15px 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: white;
  border-bottom: 1px solid #f0dce7;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 4px;
}

.logo span {
  color: #ff69ad;
}

.search {
  width: 40%;
  padding: 12px 18px;
  border: 1px solid #ead6e1;
  border-radius: 30px;
  outline: none;
}

.profile {
  border: none;
  background: #ffe0ef;
  padding: 11px 16px;
  border-radius: 20px;
  cursor: pointer;
}

.hero {
  margin: 25px;
  padding: 40px;
  border-radius: 30px;
  background: linear-gradient(135deg, #ffd2e8, #eadbff);
}

.hero h1 {
  font-size: 40px;
  margin: 0 0 10px;
}

.hero p {
  color: #665866;
}

nav {
  display: flex;
  gap: 10px;
  padding: 0 25px 20px;
  overflow-x: auto;
}

nav button {
  border: 1px solid #ead6e1;
  background: white;
  padding: 11px 18px;
  border-radius: 20px;
  cursor: pointer;
  white-space: nowrap;
}

nav button.active,
.pink {
  background: #ff69ad;
  color: white;
  border-color: #ff69ad;
}

.page {
  display: none;
  padding: 0 25px 100px;
}

.page.active {
  display: block;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 18px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 22px;
  border: 1px solid #ead6e1;
  box-shadow: 0 8px 25px rgba(80, 30, 60, .06);
}

.picture {
  height: 160px;
  border-radius: 17px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 55px;
  background: #f8dfeb;
  overflow: hidden;
}

.picture img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card h3 {
  margin-bottom: 5px;
}

.card p {
  color: #756875;
}

button {
  font-weight: bold;
}

.action,
.option {
  border: none;
  background: #fff0f6;
  padding: 10px 13px;
  border-radius: 12px;
  cursor: pointer;
  margin: 5px 5px 5px 0;
}

.action:hover,
.option:hover,
.profile:hover,
nav button:hover {
  transform: translateY(-1px);
  opacity: 0.9;
}

.premium {
  border: 2px solid #ff69ad;
  background: linear-gradient(135deg, white, #fff0f8);
}

.result {
  margin-top: 20px;
  padding: 20px;
  border-radius: 18px;
  background: #fff;
  border: 1px solid #ead6e1;
}

.photo-stage {
  margin-top: 20px;
  padding: 20px;
  border-radius: 20px;
  background: linear-gradient(135deg, #ffd7eb, #e9dcff);
  text-align: center;
}

.photo-preview {
  max-width: 100%;
  width: 320px;
  max-height: 420px;
  object-fit: cover;
  border-radius: 20px;
  border: 8px solid white;
  box-shadow: 0 8px 30px rgba(0,0,0,.15);
}

.template-pink {
  border-color: #ff69ad;
}

.template-kawaii {
  border-color: #c99cff;
}

.template-retro {
  border-color: #222;
}

.bottom {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  justify-content: space-around;
  padding: 13px;
  background: white;
  border-top: 1px solid #ead6e1;
  z-index: 20;
}

.bottom button {
  border: none;
  background: transparent;
  cursor: pointer;
}

body.dark {
  background: #17131a;
  color: white;
}

body.dark .card,
body.dark .result,
body.dark header,
body.dark .bottom,
body.dark nav button {
  background: #241e28;
  color: white;
  border-color: #4b3c50;
}

body.dark .card p,
body.dark .hero p {
  color: #d4c8d6;
}
